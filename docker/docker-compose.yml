services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - BACKEND_URL=http://api:8000
